<!DOCTYPE html>
<html>
  <head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	  <style>
img {
    width: 100px;
    height: 100px;
    display: block;
    margin: 0 auto 5px;
}

p {
    margin: 0;
}
      legend{
          text-align:center;
          }
         
.container {
    width: 300px;
    height: 600px;
    background: linear-gradient(159deg, #000000, #333399);
    border-radius: 21px;
    text-align: center;
    margin: 20px auto;
    border: 5px solid white;
}

.container img {
    border-radius: 50%;
    display: block;
    width: 100px;
    height: 100px;
	  }


.container p {
    margin: 0 0 10px;
    
}

.container input {
    display: block;
    width: 200px;
    margin: 10px auto;
};		      
		        
   body{
     background-color:#000000;
              }
	  input{
		  color:white;
	  }
    p{
		 color: white;
	 }
	 #message {
    display: none;
    width: 85%;
    margin: 20px auto;
    padding: 18px;
    border-radius: 14px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    box-sizing: border-box;
}

.success {
    background: #d4edda;
    color: #155724;
    border: 2px solid #28a745;
}

.error {
    background: #f8d7da;
    color: #721c24;
    border: 2px solid #dc3545;
     }
  </style>
  </head>
  <body>
  <div class="container">
  <img src="file.png">
    <p>USER_ID 369029</p>

<form>
<div id="successMessage"></div>
  <input type="email" id="email" placeholder="Email" required>
<br>
  <input type="password" id="password" placeholder="Password" required>
	<br>
	<label for="country"></label>
<div id="message"></div>
<select id="country" name="country" required>
    <option value="">Select Country</option>
    <option value="Nigeria">Nigeria</option>
    <option value="Ghana">Ghana</option>
    <option value="United States">United States</option>
    <option value="United Kingdom">United Kingdom</option>
    <option value="Germany">Germany</option>
    <option value="Canada">Canada</option>
    <option value="South Africa">South Africa</option>
    <option value="France">France</option>
    <option value="Italy">Italy</option>
    <option value="Spain">Spain</option>
</select>
	<br><br>
  <button type="submit">Create Account</button>
	<br>
<a href="login.html">
   Already have an account 
</a>
</form>
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBCEGR-H-5GM8d8qaE6zTvY-HdiTktpJs0",
    authDomain: "mylogin-a1a7c.firebaseapp.com",
    projectId: "mylogin-a1a7c",
    storageBucket: "mylogin-a1a7c.firebasestorage.app",
    messagingSenderId: "354827995849",
    appId: "1:354827995849:web:f8275057d8fa8a621e1b18",
    measurementId: "G-0T7XFS36QK"
  };


  // Initialize Firebase
  const app = initializeApp(firebaseConfig);

  // Initialize Authentication
  const auth = getAuth(app);


  // Get the form
  const form = document.querySelector("form");

  // Get message box
  const message = document.getElementById("message");


  // Create account
  form.addEventListener("submit", async (e) => {

    e.preventDefault();

    // Clear old message
    message.className = "";
    message.textContent = "";
    message.style.display = "none";


    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;


    try {

      // Create Firebase account
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


      // SUCCESS MESSAGE
      message.className = "success";
      message.textContent = "✓ Account created successfully!";
      message.style.display = "block";


      // Wait 3 seconds, then go to login
      setTimeout(() => {
        window.location.href = "login.html";
      }, 3000);


    } catch (error) {

      // ERROR MESSAGE
      message.className = "error";
      message.style.display = "block";


      if (error.code === "auth/email-already-in-use") {

        message.textContent =
          "✕ This email is already registered.";

      } else if (error.code === "auth/invalid-email") {

        message.textContent =
          "✕ Please enter a valid email address.";

      } else if (error.code === "auth/weak-password") {

        message.textContent =
          "✕ Password must be at least 6 characters.";

      } else {

        message.textContent =
          "✕ " + error.message;
      }

    }

  });

</script>
  </body>
</html>
